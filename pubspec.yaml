name: diet_coach_ai
description: "NextMeal creates personalized meal plans for your nutrition goals."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  mobx: ^2.3.3+2
  flutter_mobx: ^2.2.1+1

  # Navigation
  go_router: ^14.1.4

  # HTTP Client
  dio: ^5.4.0

  # Charts & Visualization
  fl_chart: ^0.68.0

  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  liquid_glass_easy: ^4.2.0

  # Auth
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2
  crypto: ^3.0.5
  purchases_flutter: ^10.11.0
  purchases_ui_flutter: ^10.11.0

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  mobx_codegen: ^2.6.0+1

flutter:
  uses-material-design: true

  assets:
    - .env
